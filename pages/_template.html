<!-- ===========================================================================
  PAGE:  [Page name]
  ---------------------------------------------------------------------------
  ONE code block for the WHOLE page. Paste into a SINGLE Squarespace Code Block.

  SQUARESPACE SECTION SETUP (do this once so the grid stops fighting us):
    • Put this block in its own Section.
    • Section → Background: none (each band below carries its own background).
    • Section → Width: Full Bleed.  Content width: Wide/Full.
    • Section → Padding top & bottom: 0.  (Spacing is owned by this block.)

  Spacing + width + palette come from the shared tokens in pages/custom-css.css
  (paste that into Design → Custom CSS once). Every value below also has a
  fallback, so the page renders correctly even before the tokens are installed.

  Scope everything under .vss-<page> so nothing leaks into the Squarespace UI.
  Reuse the shared component patterns (.vss-btn, .vss-card, .vss-badge, …) from
  home.html rather than reinventing them.
=========================================================================== -->
<div class="vss-page">

  <!-- ===== EXAMPLE BAND ==================================================== -->
  <section class="vss-band">
    <div class="vss-container">
      <!-- section markup goes here -->
    </div>
  </section>

  <!-- Add more <section class="vss-band"> … </section> blocks below. -->

</div>

<style>
  /* ---- Shared system (keep in sync with home.html) --------------------- */
  .vss-page{
    box-sizing:border-box;
    font-family:var(--vss-sans, -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif);
    /* Full-bleed breakout: escape Squarespace's centered content column so
       full-width bands can span edge-to-edge. Each .vss-container re-centers. */
    width:100vw;
    max-width:100vw;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
    overflow-x:hidden;
  }
  .vss-page *{box-sizing:border-box;}

  /* ONE container = ONE width + ONE gutter, shared by every band. */
  .vss-container{
    max-width:var(--vss-max, 1180px);
    margin-inline:auto;
    padding-inline:var(--vss-gutter, clamp(20px,5vw,48px));
  }

  /* ONE vertical rhythm = ONE clamped section pad, shared by every band. */
  .vss-band{ padding-block:var(--vss-section-y, clamp(3rem,6vw,6rem)); }

  /* ---- Page-specific styles below -------------------------------------- */

</style>
