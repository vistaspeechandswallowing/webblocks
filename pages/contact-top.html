<!-- ===========================================================================
  PAGE:  Contact — PART 1 of 2  (Vista Speech & Swallowing)
  ---------------------------------------------------------------------------
  THIS PAGE IS THREE STACKED SECTIONS. Paste this file into the FIRST one:

      Section 1  →  pages/contact-top.html      (this file)   — Code Block
      Section 2  →  the native Form block, Lightbox mode, "Request Information"
      Section 3  →  pages/contact-bottom.html                 — Code Block

  WHY IT'S SPLIT: the Request Information button is a native Squarespace Form
  block in lightbox mode — Squarespace owns it, so it can't live inside our
  markup. And it can't share a Section with our block either: the Fluid Engine
  reset at the end of custom-css.css pins every block in a :has(.vss-page)
  section to one grid cell, which is what makes the section size to our
  content. Two blocks in one Section would land on top of each other. So the
  composition opens up around the button, and each piece gets its own Section.

  THE CTA PAIR, in reading order: this file ends the tinted header band; the
  form block's button follows on white; then contact-bottom.html opens with the
  understated "or text us at …" link. Button dominant, link secondary — that
  hierarchy is the whole point, so don't reorder the sections.

  The header CLEARANCE lives here — .vss-band--pagehead carries the top padding
  that keeps the title out from under the site header. That's why this is the
  first block on the page.

  SQUARESPACE SECTION SETUP (all three sections):
    • Background: white.  Width: Full Bleed.  Content width: Wide/Full.
    • Design tab → Fill Screen: OFF, Alignment: top.
    • Section padding top & bottom: 0. (Spacing is owned by our bands.)

  PASTE IT WITH:  python3 tools/paste.py pages/contact-top.html | pbcopy
  STYLING lives in pages/custom-css.css (Design → Custom CSS).
=========================================================================== -->
