<!-- ===========================================================================
  SITE-WIDE HEADER CODE INJECTION
  ---------------------------------------------------------------------------
  WHERE THIS GOES: Squarespace → Settings → Advanced → Code Injection → HEADER.
  Paste this WHOLE file. It is site-wide — NOT a per-page injection and NOT a
  Code Block. One copy, every page.

  WHAT'S IN IT: the complete MedicalClinic JSON-LD for the practice.

  WHY MedicalClinic AND NOT MedicalBusiness: medicalSpecialty is not a valid
  property of MedicalBusiness — schema.org puts it on MedicalClinic, Hospital,
  Physician, and MedicalOrganization only. MedicalClinic is a subclass of
  MedicalBusiness (and so of LocalBusiness), so nothing is lost by being more
  specific, and the specialty becomes legal. Likewise the languages are on
  knowsLanguage, not availableLanguage: that one belongs to ContactPoint and
  ServiceChannel, not to an organization.

  ABOUT SQUARESPACE'S OWN BLOCK: Squarespace emits its own LocalBusiness JSON-LD
  from the Business Information settings. It is essentially empty (little more
  than a name and url) and cannot be turned off. Ours sits alongside it; two
  JSON-LD blocks on a page is valid, and search engines reconcile them. To keep
  them from disagreeing, the Business Information panel should either be left
  blank or filled in with EXACTLY the values below — see site/README.md.

  MUST MATCH pages/contact.html: the street address, phone, and hours
  here are the same facts shown on /contact. If they ever diverge, that is a
  bug — fix both. In particular "8850 W 58th Ave Ste 201" matches the Google
  Business Profile character for character; do NOT expand "Ste" to "Suite".

  STILL TO ADD: "sameAs" — the public Google Business Profile listing URL, which
  is what tells Google that this markup and that listing are the same business.
  It is LEFT OUT rather than left as a placeholder: an absent property is valid,
  a "[…]" string is not. To add it, put this line back after "knowsLanguage"
  (mind the comma on the line above):

      "sameAs": ["https://…the GBP listing URL…"]

  See site/README.md for where to find that URL.

  IMAGE URLS: served from the webimages repo through jsDelivr, PINNED TO A
  COMMIT (the @7de07fd… part) — the same workflow the page compositions use for
  photos. Pin to a commit, never to a branch: a branch URL changes meaning when
  the repo changes, and jsDelivr caches branch URLs for only 7 days. A
  github.com/…/blob/… link is NOT an image URL — it's an HTML page — and
  raw.githubusercontent.com is not meant for production hotlinking.

    • "logo"  — Organization.logo. Correct home for the wordmark.
    • "image" — Google wants a PHOTO of the business here (the premises, the
      team, the practitioner), not a 2.5:1 wordmark. The logo is standing in so
      the property isn't empty; swap it for a real photo when there is one.
=========================================================================== -->
<script type="application/ld+json">

  "url": "https://vistaspeech.com",
  "telephone": "+17205099640",
  "email": "nicholas@vistaspeech.com",
  "image": "https://cdn.jsdelivr.net/gh/vistaspeechandswallowing/webimages@7de07fdc48dc651efab365cca946b5a8b2c4add1/VSS%20Logo.png",
  "logo": "https://cdn.jsdelivr.net/gh/vistaspeechandswallowing/webimages@7de07fdc48dc651efab365cca946b5a8b2c4add1/VSS%20Logo.png",
  "medicalSpecialty": "SpeechPathology",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "8850 W 58th Ave Ste 201",
    "addressLocality": "Arvada",
    "addressRegion": "CO",
    "postalCode": "80002",
    "addressCountry": "US"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": "39.801726",
    "longitude": "-105.096340"
  },
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
    "opens": "09:00",
    "closes": "17:00"
  }],
  "areaServed": [
    { "@type": "City", "name": "Arvada" },
    { "@type": "City", "name": "Denver" },
    { "@type": "City", "name": "Westminster" },
    { "@type": "City", "name": "Wheat Ridge" },
    { "@type": "City", "name": "Lakewood" },
    { "@type": "State", "name": "Colorado" }
  ],
  "knowsLanguage": ["English", "Spanish"]
}
</script>
