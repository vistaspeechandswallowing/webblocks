<!-- ===========================================================================
  SITE-WIDE HEADER CODE INJECTION
  ---------------------------------------------------------------------------
  WHERE THIS GOES: Squarespace → Settings → Advanced → Code Injection → HEADER.
  Paste this WHOLE file. It is site-wide — NOT a per-page injection and NOT a
  Code Block. One copy, every page.

  WHAT'S IN IT: the complete MedicalBusiness JSON-LD for the practice.

  ABOUT SQUARESPACE'S OWN BLOCK: Squarespace emits its own LocalBusiness JSON-LD
  from the Business Information settings. It is essentially empty (little more
  than a name and url) and cannot be turned off. Ours sits alongside it; two
  JSON-LD blocks on a page is valid, and search engines reconcile them. To keep
  them from disagreeing, the Business Information panel should either be left
  blank or filled in with EXACTLY the values below — see site/README.md.

  MUST MATCH blocks/contact-details.html: the street address, phone, and hours
  here are the same facts shown on /contact. If they ever diverge, that is a
  bug — fix both. In particular "8850 W 58th Ave Ste 201" matches the Google
  Business Profile character for character; do NOT expand "Ste" to "Suite".

  BEFORE THIS GOES LIVE, replace the three bracketed placeholders:
    • "image"            — the logo/photo URL (an absolute https:// URL)
    • geo latitude/longitude — read off the Google Business Profile map pin
    • "sameAs"           — the Google Business Profile listing URL
  Leave a placeholder in and that property is invalid; strip the property out
  entirely rather than shipping a "[…]" string.
=========================================================================== -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MedicalBusiness",
  "name": "Vista Speech & Swallowing",
  "url": "https://vistaspeech.com",
  "telephone": "+17205099640",
  "email": "nicholas@vistaspeech.com",
  "image": "[LOGO URL NEEDED]",
  "medicalSpecialty": "SpeechPathology",
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "8850 W 58th Ave Ste 201",
    "addressLocality": "Arvada",
    "addressRegion": "CO",
    "postalCode": "80002",
    "addressCountry": "US"
  },
  "geo": {
    "@type": "GeoCoordinates",
    "latitude": "[FROM GBP PIN]",
    "longitude": "[FROM GBP PIN]"
  },
  "openingHoursSpecification": [{
    "@type": "OpeningHoursSpecification",
    "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
    "opens": "09:00",
    "closes": "17:00"
  }],
  "areaServed": [
    { "@type": "City", "name": "Arvada" },
    { "@type": "City", "name": "Denver" },
    { "@type": "City", "name": "Westminster" },
    { "@type": "City", "name": "Wheat Ridge" },
    { "@type": "City", "name": "Lakewood" },
    { "@type": "State", "name": "Colorado" }
  ],
  "availableLanguage": ["English", "Spanish"],
  "sameAs": ["[GBP LISTING URL NEEDED]"]
}
</script>
